name: structureflutter
description: A new Flutter project For Training.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^5.1.0

  equatable: ^2.0.7
  connectivity_plus: ^7.0.0

  # Resource localizations
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  shared_preferences: ^2.5.3
  json_annotation: ^4.9.0
  http: ^1.5.0

  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.2
  carousel_slider: ^5.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.10.1
  json_serializable: ^6.11.1

  flutter_lints: ^6.0.0


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # Generation resource
  generate: true

  assets:
    - assets/
    - assets/images/

  fonts:
    - family: HelveticaNeue
      fonts:
        - asset: assets/fonts/HelveticaNeue-Thin.ttf
          weight: 100
        - asset: assets/fonts/HelveticaNeue-Light.ttf
          weight: 300
        - asset: assets/fonts/HelveticaNeue-Medium.ttf
          weight: 500
        - asset: assets/fonts/HelveticaNeue-Bold.ttf
          weight: 700
        - asset: assets/fonts/HelveticaNeue-Black.ttf
          weight: 900
